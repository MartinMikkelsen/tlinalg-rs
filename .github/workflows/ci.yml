name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy -j 16 --workspace --all-targets -- -D warnings
      - run: cargo clippy -j 16 --workspace --all-targets --features tlinalg-blas/link-openblas,tlinalg-blas/provider-inject -- -D warnings

  # The LAPACK kernels need linked symbols. `link-openblas` builds OpenBLAS from source through
  # `openblas-src`, so no system package is required.
  test:
    name: cargo test (ubuntu-latest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -j 16 --workspace --profile ci --features tlinalg-blas/link-openblas
      # The injected symbol set exports ?gesvd but not ?gesdd, so the other driver has to be
      # exercised too; OpenBLAS provides both symbols.
      - run: cargo test -j 16 --workspace --profile ci --features tlinalg-blas/link-openblas,tlinalg-blas/provider-inject

  # Without a vendor library the faer provider still runs in full and the LAPACK marshalling still
  # has to compile.
  test-unlinked:
    name: cargo test (macos-latest, unlinked)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -j 16 --workspace --profile ci

  doc:
    name: cargo doc
    runs-on: ubuntu-latest
    env:
      RUSTDOCFLAGS: -D warnings
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo doc -j 16 --workspace --no-deps
