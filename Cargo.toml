[workspace]
members = [
    "crates/tlinalg",
    "crates/tlinalg-blas",
    "crates/tlinalg-testkit",
    "crates/tlinalg-parity",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.89"
license = "MIT OR Apache-2.0"
authors = ["Hiroshi Shinaoka <h.shinaoka@gmail.com>", "tensor4all contributors"]
repository = "https://github.com/tensor4all/tlinalg-rs"
publish = false

[workspace.dependencies]
tlinalg = { version = "0.1.0", path = "crates/tlinalg" }
tlinalg-blas = { version = "0.1.0", path = "crates/tlinalg-blas" }
tlinalg-testkit = { path = "crates/tlinalg-testkit" }
faer = { version = "0.24", default-features = false, features = ["std", "rayon"] }
# Spelled exactly as tenferro pins it, so both resolve one strided-rs source and share
# `RawStridedRef`.
strided-view = { git = "https://github.com/tensor4all/strided-rs.git", rev = "c12d96fa4cfef622bc1f15fd9940fd418fb686ac", version = "0.4.5" }
num-complex = "0.4"
rayon = "1.10"
thiserror = "2"
# LAPACK/BLAS provider only.
lapack = "0.20"
cblas-sys = "0.1"
blas-src = { version = "0.14", default-features = false }
lapack-src = "0.13"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.dev]
debug = 0

[profile.test]
debug = 0

[profile.ci]
inherits = "test"
incremental = false
strip = "symbols"
