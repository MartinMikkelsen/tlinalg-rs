[package]
name = "tlinalg-bench"
description = "Kernel-level Criterion benchmarks comparing the tlinalg (faer) and tlinalg-blas (LAPACK) providers."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish = false

[features]
default = []
# Link OpenBLAS and add the LAPACK provider's rows. Without it only the faer rows run.
link-openblas = ["tlinalg-blas/link-openblas"]
# The same vendor, linked statically, so the built harness can be executed directly with no
# loader search path to arrange. The benchmark campaign measures this configuration.
link-openblas-static = ["tlinalg-blas/link-openblas-static"]

[dependencies]
tlinalg = { workspace = true }
tlinalg-blas = { workspace = true }
tlinalg-testkit = { workspace = true }
num-complex = { workspace = true }
rayon = { workspace = true }
strided-view = { workspace = true }

[dev-dependencies]
criterion = { workspace = true }

[[bench]]
name = "kernels"
harness = false

[lints]
workspace = true
